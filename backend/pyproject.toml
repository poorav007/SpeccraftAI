[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speccraft-backend"
version = "0.1.0"
description = "SpecCraft AI static AST parser, OpenAPI 3.0 generator, validator, and diff engine"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
